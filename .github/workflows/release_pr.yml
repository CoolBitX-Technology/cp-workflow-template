name: Release PR

on:
  workflow_call:
    inputs:
      head_branch:
        type: string
        default: dev
      base_branch:
        type: string
        default: master
      create_pr:
        description: 沒有開著的 release PR 時是否開新 PR。caller 傳 `github.event_name != 'push'`，push 觸發時就只更新 body。
        type: boolean
        default: true
    secrets:
      PERSONAL_ACCESS_TOKEN:
        required: true

# GITHUB_TOKEN 只給 actions/checkout 用；所有 PR 讀寫都走 PAT。
permissions:
  contents: read

jobs:
  release-pr:
    runs-on: ubuntu-latest
    # 排隊而不取消：排程和 push 可能同時觸發，若取消掉負責開 PR 的那個 run，
    # 就要等到下次排程才會開。依序執行也能避免較舊的 run 晚完成、用舊列表覆蓋 body。
    concurrency:
      group: release-pr-${{ github.repository }}-${{ inputs.head_branch }}-${{ inputs.base_branch }}
      cancel-in-progress: false
    env:
      HEAD_BRANCH: ${{ inputs.head_branch }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      RANGE: origin/${{ inputs.base_branch }}..origin/${{ inputs.head_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 輸出 release PR 編號；需要 skip 時不輸出，下一個 step 就會顯示為 skipped。
      - name: Find or create release PR
        id: pr
        env:
          # PAT 只放在需要它的 step，不放 job 層，避免暴露給 checkout 等其他 step。
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          CREATE_PR: ${{ inputs.create_pr }}
        run: |
          git fetch origin "$HEAD_BRANCH" "$BASE_BRANCH" --quiet

          if [ -z "$(git log "$RANGE" --oneline)" ]; then
            echo "No new commits between $HEAD_BRANCH and $BASE_BRANCH. Skipping."
            exit 0
          fi

          PR=$(gh pr list --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --state open --json number -q '.[0].number')

          if [ -z "$PR" ]; then
            if [ "$CREATE_PR" != "true" ]; then
              echo "No open release PR for $HEAD_BRANCH → $BASE_BRANCH and create_pr is off. Skipping."
              exit 0
            fi

            PR=$(gh pr create --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --body "" \
              --title "release: $HEAD_BRANCH -> $BASE_BRANCH ($(date +'%Y-%m-%d'))")
            echo "Created $PR"
          fi

          echo "number=$PR" >> "$GITHUB_OUTPUT"

      - name: Update release PR body
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          # `|| true`：沒有 merge commit 時 grep 會 exit 1，
          # 預設的 `bash -e` 會把它當成失敗直接中止。
          PR_NUMS=$(git log --merges --reverse --pretty='%s' "$RANGE" \
            | grep -oP '^Merge pull request #\K[0-9]+' || true)

          BODY="## Included PRs"$'\n\n'
          for num in $PR_NUMS; do
            TITLE=$(gh pr view "$num" --json title -q '.title' 2>/dev/null) || TITLE="(title unavailable)"
            BODY+="- #${num} ${TITLE}"$'\n'
          done
          BODY+=$'\n---\n*Auto-generated by [release_pr](https://github.com/CoolBitX-Technology/cp-workflow-template)*'

          gh pr edit "$PR" --body "$BODY"
          echo "Release PR $PR body updated."
