name: Release PR

on:
  workflow_call:
    inputs:
      head_branch:
        type: string
        default: dev
      base_branch:
        type: string
        default: master
      create_pr:
        description: 沒有開著的 release PR 時是否開新 PR。caller 傳 `github.event_name != 'push'`，push 觸發時就只更新 body。
        type: boolean
        default: true
      app_client_id:
        description: release PR 用的 GitHub App client ID。有給就用 App token，沒給就用 PERSONAL_ACCESS_TOKEN。
        type: string
        default: ''
    # 兩個 secret 都是選填，讓 caller 可以一個一個從 PAT 換成 App；caller 若傳了這裡沒宣告的 secret，run 會失敗。
    # ponytail: 所有 caller 都換成 App 後，移除 PERSONAL_ACCESS_TOKEN 和 fallback。
    secrets:
      PERSONAL_ACCESS_TOKEN:
        required: false
      RELEASE_APP_PRIVATE_KEY:
        required: false

# GITHUB_TOKEN 只給 actions/checkout 和之後的 git fetch 用；所有 PR 讀寫都走 App token（或 PAT）。
permissions:
  contents: read

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 排隊而不取消：同一時間只有一個 run 在跑，較舊的 run 不會晚完成、用舊列表覆蓋 body；
    # 執行中的 run 也不會被後來的 run 取消。
    # 限制：GitHub 每個 group 只保留一個等待中的 run，有更新的 run 進來時，等待中的會被取消。
    # 若前一個 run 還在跑、排程 run 正在等待時又有一次 push 進來，排程 run 會被擠掉，
    # PR 要等下次排程或手動觸發才會開（機率很低）。
    concurrency:
      group: release-pr-${{ github.repository }}-${{ inputs.head_branch }}-${{ inputs.base_branch }}
      cancel-in-progress: false
    env:
      HEAD_BRANCH: ${{ inputs.head_branch }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      RANGE: origin/${{ inputs.base_branch }}..origin/${{ inputs.head_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # token 只限當前 repo、只有 PR 讀寫和讀 contents，一小時後失效，job 結束時會被撤銷。
      - name: Create GitHub App token
        id: app-token
        if: inputs.app_client_id != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-contents: read

      # 輸出 release PR 編號；需要 skip 時不輸出，下一個 step 就會顯示為 skipped。
      - name: Find or create release PR
        id: pr
        env:
          # token 只放在需要它的 step，不放 job 層，避免暴露給 checkout 等其他 step。
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.PERSONAL_ACCESS_TOKEN }}
          CREATE_PR: ${{ inputs.create_pr }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Pass app_client_id + RELEASE_APP_PRIVATE_KEY (or PERSONAL_ACCESS_TOKEN)."
            exit 1
          fi

          if [ -z "$(git log "$RANGE" --oneline)" ]; then
            echo "No new commits between $HEAD_BRANCH and $BASE_BRANCH. Skipping."
            exit 0
          fi

          PR=$(gh pr list --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --state open --json number -q '.[0].number')

          if [ -z "$PR" ]; then
            if [ "$CREATE_PR" != "true" ]; then
              echo "No open release PR for $HEAD_BRANCH → $BASE_BRANCH and create_pr is off. Skipping."
              exit 0
            fi

            PR=$(gh pr create --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --body "" \
              --title "release: $HEAD_BRANCH -> $BASE_BRANCH ($(TZ=Asia/Taipei date +'%Y-%m-%d'))")
            echo "Created $PR"
            PR=${PR##*/}   # gh pr create 回傳 URL，只保留 PR 編號
          fi

          echo "number=$PR" >> "$GITHUB_OUTPUT"

      - name: Update release PR body
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.PERSONAL_ACCESS_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          # 兩種合併方式都抓：merge commit 的標題是 `Merge pull request #N from ...`，
          # squash 的標題結尾是 `(#N)`（例如 dependabot 自動合併的 PR）。
          # awk 去除重複的編號。pipeline 的結束碼取最後的 awk（預設 shell 是 `bash -e`，沒開 pipefail），
          # 所以 grep 沒有 match 時的 exit 1 不會中止 step；`|| true` 只是保險。
          PR_NUMS=$(git log --reverse --pretty='%s' "$RANGE" \
            | grep -oP '^Merge pull request #\K[0-9]+|\(#\K[0-9]+(?=\)$)' \
            | awk '!seen[$0]++' || true)

          BODY="## Included PRs"$'\n\n'
          if [ -z "$PR_NUMS" ]; then
            BODY+="_No merged PRs yet._"$'\n'
          fi
          # 只寫編號：列表項目裡的 `#N` 在 GitHub 上會自動展開成「圖示 + PR 標題」，
          # 自己再寫標題就會重複顯示。
          for num in $PR_NUMS; do
            BODY+="- #${num}"$'\n'
          done
          BODY+=$'\n---\n*Auto-generated by [release_pr](https://github.com/CoolBitX-Technology/cp-workflow-template)*'

          # 用 REST（gh api）而不用 gh pr edit：後者走 GraphQL，會順帶查 reviewer team 等欄位，
          # 只有 `repo` scope 的 classic PAT 會因缺 `read:org` 失敗。
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR" -f body="$BODY" --silent
          echo "Release PR $PR body updated."
