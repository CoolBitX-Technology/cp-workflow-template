name: Nofity Slack

on: 
  workflow_call:
    secrets:
      CP_SLACK_CHANNEL_RG_CRYPTO:
        required: true

jobs:
  notify_slack:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: technote-space/workflow-conclusion-action@v3.0.3
        if: ${{ ! env.ACT }}

      - name: vars
        id: vars
        # 所有 event 欄位都走 env 再用 "$VAR" 引用，不在 run 裡直接內插 ${{ }}：
        # commit message、PR title、branch 名稱都可以由有 push 權限的人任意構造，內插會變成 script injection。
        env:
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          STATUS=${WORKFLOW_CONCLUSION:-success} # neutral, success, skipped, cancelled, timed_out, action_required, failure
          if [[ `echo 'success' | grep -E ${STATUS}` ]]; then
            ICON_EMOJI=":white_check_mark:"
          elif [[ `echo 'failure' | grep -E ${STATUS}` ]]; then
            ICON_EMOJI=":sos:"
          else
            ICON_EMOJI=":eyes:"
          fi
          MESSAGE=" ${ICON_EMOJI} \`dev\` \`${STATUS}\` @${ACTOR}
          this is message"
          FOOTER="this is footer"
          if [[ -z "${ACT:-}" ]]; then
            STATUS=${WORKFLOW_CONCLUSION}
            if [[ "push" == "$EVENT_NAME" ]]; then
              MESSAGE=" ${ICON_EMOJI} \`${REF_NAME}\` \`${STATUS}\`
              ${HEAD_COMMIT_MESSAGE}"
              FOOTER="*${REF_NAME}* of _${REPOSITORY}_"
            elif [[ "pull_request" == "$EVENT_NAME" ]]; then
              MESSAGE=" ${ICON_EMOJI} \`${BASE_REF}\` \`${STATUS}\`
              ${PR_TITLE}"
              FOOTER="*${HEAD_REF}* of _${REPOSITORY}_"
            fi
          fi

          echo "message=${MESSAGE//$'\n'/'%0A'}" >> $GITHUB_OUTPUT
          echo "footer=${FOOTER}" >> $GITHUB_OUTPUT
          echo "status=${STATUS}" >> $GITHUB_OUTPUT

      - name: slack_notification
        uses: rtCamp/action-slack-notify@v2.3.0
        env:
          SLACK_WEBHOOK: ${{ secrets.CP_SLACK_CHANNEL_RG_CRYPTO }}
          SLACK_USERNAME: Github Action
          SLACK_ICON_EMOJI: ":robot_face:"
          SLACK_COLOR: ${{ steps.vars.outputs.status }}
          SLACK_MESSAGE: ${{ steps.vars.outputs.message }}
          SLACK_FOOTER: ${{ steps.vars.outputs.footer }}
          SLACK_LINK_NAMES: true
