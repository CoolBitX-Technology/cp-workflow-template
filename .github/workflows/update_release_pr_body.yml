name: Update Release PR Body

on:
  workflow_call:
    inputs:
      head_branch:
        type: string
        default: dev
      base_branch:
        type: string
        default: master
    secrets:
      PERSONAL_ACCESS_TOKEN:
        required: true

# GITHUB_TOKEN is only used by actions/checkout; all PR reads/writes go through the PAT.
permissions:
  contents: read

jobs:
  update-release-pr-body:
    runs-on: ubuntu-latest
    # Back-to-back pushes to head_branch would otherwise race, and an older run
    # finishing last overwrites the body with a stale PR list.
    concurrency:
      group: update-release-pr-body-${{ github.repository }}-${{ inputs.head_branch }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update release PR body
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          HEAD_BRANCH: ${{ inputs.head_branch }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          git fetch origin "$HEAD_BRANCH" "$BASE_BRANCH" --quiet

          # `|| true`: grep exits 1 on no match, and the default `bash -e` shell
          # would abort here instead of reaching the skip branch below.
          PR_NUMS=$(git log --merges --reverse \
            --grep='Merge pull request #' \
            --pretty='%s' \
            "origin/$BASE_BRANCH..origin/$HEAD_BRANCH" \
            | grep -oP '^Merge pull request #\K[0-9]+' || true)

          if [ -z "$PR_NUMS" ]; then
            echo "No merge commits found between $BASE_BRANCH and $HEAD_BRANCH. Skipping."
            exit 0
          fi

          OPEN_PR=$(gh pr list --head "$HEAD_BRANCH" --base "$BASE_BRANCH" \
            --state open --json number -q '.[0].number')

          if [ -z "$OPEN_PR" ]; then
            echo "No open release PR found for $HEAD_BRANCH → $BASE_BRANCH. Skipping."
            exit 0
          fi

          BODY="## Included PRs"$'\n\n'
          while IFS= read -r num; do
            TITLE=$(gh pr view "$num" --json title -q '.title' 2>/dev/null) || TITLE="(title unavailable)"
            BODY+="- #${num} ${TITLE}"$'\n'
          done <<< "$PR_NUMS"
          BODY+=$'\n---\n*Auto-generated by [update_release_pr_body](https://github.com/CoolBitX-Technology/cp-workflow-template)*'

          gh pr edit "$OPEN_PR" --body "$BODY"
          echo "PR #$OPEN_PR body updated."
