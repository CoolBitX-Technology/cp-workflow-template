name: Auto Create Release PR

on:
  workflow_call:
    inputs:
      head_branch:
        type: string
        default: dev
      base_branch:
        type: string
        default: master
      pr_title:
        type: string
        default: ""
      reviewers:
        type: string
        default: ""
      labels:
        type: string
        default: ""
      draft:
        type: boolean
        default: false
    secrets:
      PERSONAL_ACCESS_TOKEN:
        required: true

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release PR
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          HEAD_BRANCH: ${{ inputs.head_branch }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          PR_TITLE: ${{ inputs.pr_title }}
          REVIEWERS: ${{ inputs.reviewers }}
          LABELS: ${{ inputs.labels }}
          DRAFT: ${{ inputs.draft }}
        run: |
          git fetch origin "$HEAD_BRANCH" "$BASE_BRANCH" --quiet

          if [ -z "$(git log origin/$BASE_BRANCH..origin/$HEAD_BRANCH --oneline)" ]; then
            echo "No new commits between $HEAD_BRANCH and $BASE_BRANCH. Skipping."
            exit 0
          fi

          existing=$(gh pr list --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing already exists. Skipping."
            exit 0
          fi

          DATE=$(date +'%Y-%m-%d')
          TITLE="${PR_TITLE:-release: $HEAD_BRANCH -> $BASE_BRANCH ($DATE)}"
          ARGS=(--head "$HEAD_BRANCH" --base "$BASE_BRANCH" --title "$TITLE" --body "")
          [ "$DRAFT" = "true" ]  && ARGS+=(--draft)
          [ -n "$REVIEWERS" ]    && ARGS+=(--reviewer "$REVIEWERS")
          [ -n "$LABELS" ]       && ARGS+=(--label "$LABELS")

          gh pr create "${ARGS[@]}"
