name: Build and Publish Official public NPM Package (OIDC)

on:
  workflow_call:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          scope: '@coolbitx'
      - run: npm install -g npm@11.5.1
      - run: npm ci
      - run: npm test
      - run: npm publish --access public
      - name: Verify publication
        run: npm view "$(npm pkg get name | tr -d '"')@$(npm pkg get version | tr -d '"')" version
